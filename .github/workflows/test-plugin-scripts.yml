# Runs the Python test suites that ship inside plugins.
#
# Some skills bundle executable helper scripts (skills/<skill>/scripts/*.py) plus
# their own tests (skills/<skill>/tests/). Those scripts are stdlib-only by
# design, so pytest is the ONLY dependency this workflow installs — do not add a
# requirements file here. If a bundled script ever needs a third-party package,
# that is a design problem to fix in the script, not in this workflow.
#
# Discovery is generic: every plugins/**/tests/ directory containing test_*.py
# is run as its own pytest invocation. Separate invocations keep each suite's
# conftest.py (which puts its sibling scripts/ on sys.path with flat module
# names) from colliding with another suite's.
name: Test bundled plugin scripts

on:
  push:
    paths:
      - "plugins/**/*.py"
      - "plugins/**/*.json"
      - "plugins/**/tests/**"
      - ".github/workflows/test-plugin-scripts.yml"
  pull_request:
    paths:
      - "plugins/**/*.py"
      - "plugins/**/*.json"
      - "plugins/**/tests/**"
      - ".github/workflows/test-plugin-scripts.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest (bundled scripts are stdlib-only)
        run: python -m pip install --upgrade pytest

      - name: Run bundled plugin test suites
        run: |
          set -euo pipefail

          # Known suites that must always exist. A rename or an accidental
          # deletion has to fail the build, not silently shrink coverage.
          REQUIRED_SUITES=(
            "plugins/bpa-mcp/skills/columns-normalization-migration/tests"
          )
          for suite in "${REQUIRED_SUITES[@]}"; do
            if [ ! -d "$suite" ]; then
              echo "::error::required test suite is missing: $suite"
              exit 1
            fi
          done

          # Generic discovery: any plugins/**/tests/ holding test_*.py files.
          suites=()
          while IFS= read -r dir; do
            if compgen -G "$dir/test_*.py" > /dev/null; then
              suites+=("$dir")
            fi
          done < <(find plugins -type d -name tests | sort)

          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no plugin test suites found under plugins/"
            exit 1
          fi

          failed=0
          for suite in "${suites[@]}"; do
            echo "::group::pytest $suite"
            if ! python -m pytest "$suite" -q -p no:cacheprovider; then
              failed=1
            fi
            echo "::endgroup::"
          done

          exit "$failed"
