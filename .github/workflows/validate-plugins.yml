name: Validate Plugin Frontmatter

on:
  push:
    paths:
      - 'plugins/**/*.md'
  pull_request:
    paths:
      - 'plugins/**/*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun add yaml
      - run: bun .github/scripts/validate-frontmatter.ts ./plugins
